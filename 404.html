<!DOCTYPE html>
<html lang="en">
  <head>
    

    <meta charset="UTF-8">
    <title>404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style> .site-name, .site-name:link, .site-name:visited { color: var(--text); text-decoration: none; display: inline-block; }
.site-name:hover, .site-name:active { color: var(--text); text-decoration: none; }
.error-body { text-align: center; }
.error-code { font-family: 'DM Serif Display', Georgia, serif; font-size: 80px; line-height: 1; letter-spacing: -1px; margin-bottom: 12px; color: var(--text); }
.error-message { font-size: 16px; line-height: 1.8; color: var(--muted); margin-bottom: 28px; margin-top: 0; }
.home-link, .home-link:link, .home-link:visited { font-size: 13px; font-weight: 400; color: var(--link); text-decoration: none; transition: color 0.15s; }
.home-link:hover, .home-link:active { color: var(--link-h); text-decoration: none; }
@media (max-width: 480px) { .error-code { font-size: 64px; } } </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <header class="site-header">
